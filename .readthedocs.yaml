# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Set the version of Python and other tools
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    post_create_environment:
      # Install dependencies needed for building the project
      - pip install --upgrade pip setuptools wheel
    pre_build:
      # Generate dynamic documentation before Sphinx build
      - cd docs && python generate_models.py

# Python configuration
python:
  install:
    # Install the package itself (needed for autodoc to import modules)
    - method: pip
      path: .
    # Install documentation dependencies
    - requirements: docs/requirements.txt